<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Cart</title>
  <link rel="icon" type="image/x-icon" href="/images/IMG_0106.jpeg">
  <link rel="stylesheet" href="/score.css">
  <link rel="stylesheet" href="/cookie.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .cart-container { max-width: 800px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .cart-summary { margin-top: 20px; text-align: right; font-size: 1.25rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="body">
    <div class="nav-holder">
      <div class="Owner"><a href="/" title="Emmanuel O. Solomon - Home">Emmanuel O. Solomon</a></div>
      <button title="hamburger" class="hamburger" id="hamburgerBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <div class="middle-links" id="navLinks"></div>
    </div>

    <main class="cart-container">
      <h1>Your Cart</h1>
      <div id="items">Loading cart...</div>
      <div class="cart-summary">
        Total: <span id="total">$0.00</span>
      </div>
      <div style="text-align:right; margin-top:20px;">
        <button id="checkout" class="btn btn-primary" style="background-color: rgb(200, 7, 7) !important; border-color: rgb(200, 7, 7) !important;">Proceed to Checkout</button>
      </div>
    </main>

    <div class="red4">
      <div class="middle-links3" id="footerLinks"></div>
      <p class="copyright">© 2026 Emmanuel O. Solomon. All rights reserved.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/cookie.js"></script>
  <script src="/index.js"></script>
  <script src="/js/shop.js?v=4"></script>
</body>
</html>
